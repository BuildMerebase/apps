<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F6F3; --surface: #FFFFFF; --border: #E8E3DD;
    --ink: #1C1A18; --muted: #7A7068; --subtle: #B8B0A6;
    --amber: #D97706; --amber-dk: #B45309; --amber-bg: rgba(217,119,6,0.08);
    --green: #059669; --green-bg: rgba(5,150,105,0.1);
    --r: 8px; --shadow: 0 1px 3px rgba(28,26,24,0.06), 0 8px 24px rgba(28,26,24,0.04);
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; padding: 2rem 1rem; }
  .app { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 2rem; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .header-left h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; }
  .header-left h1 span { color: var(--amber); }
  .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
  .btn { padding: 0.65rem 1.1rem; border-radius: var(--r); border: none; font-size: 0.85rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--amber); color: #fff; }
  .btn-primary:hover { background: var(--amber-dk); }
  .btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.75rem; }

  /* Day header */
  .week-grid { margin-bottom: 1.5rem; }
  .day-header { display: grid; grid-template-columns: 1fr repeat(7, 36px); gap: 0.5rem; align-items: center; padding: 0 0 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
  .day-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--subtle); text-align: center; }
  .day-label.today { color: var(--amber-dk); }

  /* Habit row */
  .habit-row { display: grid; grid-template-columns: 1fr repeat(7, 36px); gap: 0.5rem; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 0.75rem 1rem; margin-bottom: 0.5rem; box-shadow: var(--shadow); }
  .habit-name-wrap { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
  .habit-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .habit-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-streak { font-size: 0.7rem; color: var(--muted); margin-top: 0.1rem; }
  .habit-check { width: 32px; height: 32px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; margin: auto; background: none; transition: all 0.15s; }
  .habit-check:hover { border-color: var(--amber); background: var(--amber-bg); }
  .habit-check.checked { background: var(--green); border-color: var(--green); }
  .habit-check.checked::after { content: ''; width: 6px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px,-1px); display: block; }
  .habit-check.future { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  /* Add habit */
  .add-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.25rem; margin-top: 1.5rem; box-shadow: var(--shadow); }
  .add-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 1rem; }
  .add-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .add-input { flex: 1; min-width: 160px; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.9rem; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; transition: border-color 0.15s; }
  .add-input:focus { border-color: var(--amber); }
  .color-options { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .color-opt { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
  .color-opt.selected { border-color: var(--ink); transform: scale(1.15); }

  .empty { padding: 2.5rem 1rem; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
  .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .empty-text { font-size: 0.875rem; color: var(--muted); }
  .habit-actions { display: flex; gap: 0.35rem; margin-left: auto; }
  .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <h1>Habit <span>tracker</span></h1>
      <p class="subtitle">Build streaks, one day at a time.</p>
    </div>
  </header>

  <div id="week-grid" class="week-grid"><div class="loading">Loading…</div></div>

  <div class="add-section">
    <div class="add-title">Add a habit</div>
    <div class="add-row">
      <input class="add-input" id="habit-name" placeholder="e.g. Exercise, Read, Meditate" maxlength="40">
      <button class="btn btn-primary" id="add-habit-btn">Add habit</button>
    </div>
    <div class="color-options" id="color-options"></div>
  </div>
</div>

<script>
const COLORS = ['#D97706','#059669','#3B82F6','#8B5CF6','#EC4899','#EF4444','#0EA5E9','#F59E0B'];
const MOCK = { habits: [], checkins: {} };
const DB = window.MB ? {
  async get(k) { const {value} = await fetch(`${MB.api}/data?app_id=${MB.app_id}&key=${k}`,{credentials:'include'}).then(r=>r.json()); return value; },
  async set(k,v) { await fetch(`${MB.api}/data`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({app_id:MB.app_id,key:k,value:v})}); }
} : {
  async get(k) { return MOCK[k] ?? null; },
  async set(k,v) { MOCK[k] = v; }
};

let habits = [], checkins = {}, selectedColor = COLORS[0];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function dateKey(d) { return d.toISOString().slice(0,10); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

function getWeekDays() {
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for (let i = -6; i <= 0; i++) days.push(addDays(today, i));
  return days;
}

function streak(habitId) {
  const today = new Date(); today.setHours(0,0,0,0);
  let s = 0, d = new Date(today);
  while (true) {
    const k = dateKey(d);
    if (checkins[k] && checkins[k].includes(habitId)) { s++; d = addDays(d,-1); }
    else break;
  }
  return s;
}

function isChecked(habitId, dateStr) {
  return !!(checkins[dateStr] && checkins[dateStr].includes(habitId));
}

async function toggleCheckin(habitId, dateStr) {
  if (!checkins[dateStr]) checkins[dateStr] = [];
  const idx = checkins[dateStr].indexOf(habitId);
  if (idx === -1) checkins[dateStr].push(habitId);
  else checkins[dateStr].splice(idx, 1);
  await DB.set('checkins', checkins);
  render();
}

async function removeHabit(id) {
  habits = habits.filter(h => h.id !== id);
  await DB.set('habits', habits);
  render();
}

function render() {
  const wrap = document.getElementById('week-grid');
  const days = getWeekDays();
  const todayStr = dateKey(new Date());

  if (!habits.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">🌱</div><p class="empty-text">No habits yet — add your first one below.</p></div>`;
    return;
  }

  const dayNames = days.map(d => {
    const str = dateKey(d);
    const isToday = str === todayStr;
    const label = isToday ? 'Today' : d.toLocaleDateString('en-AU',{weekday:'short'});
    return `<div class="day-label ${isToday?'today':''}">${label}</div>`;
  });

  const habitRows = habits.map(h => {
    const s = streak(h.id);
    const checks = days.map(d => {
      const str = dateKey(d);
      const isToday = str === todayStr;
      const isFuture = str > todayStr;
      const checked = isChecked(h.id, str);
      return `<button class="habit-check ${checked?'checked':''} ${isFuture?'future':''}" data-habit="${h.id}" data-date="${str}" style="${checked?`background:${h.color};border-color:${h.color}`:''}"></button>`;
    }).join('');
    return `
      <div class="habit-row">
        <div>
          <div class="habit-name-wrap">
            <div class="habit-dot" style="background:${h.color}"></div>
            <span class="habit-name">${esc(h.name)}</span>
            <button class="btn btn-ghost btn-sm" data-remove="${h.id}" style="margin-left:auto;font-size:0.7rem;padding:0.2rem 0.5rem;color:var(--subtle);border-color:var(--border)">×</button>
          </div>
          <div class="habit-streak">${s > 0 ? `🔥 ${s} day streak` : 'Start today'}</div>
        </div>
        ${checks}
      </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="day-header">
      <div></div>
      ${dayNames.join('')}
    </div>
    ${habitRows}`;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('week-grid').addEventListener('click', async e => {
  const check = e.target.closest('[data-habit]');
  const remove = e.target.closest('[data-remove]');
  if (check) await toggleCheckin(check.dataset.habit, check.dataset.date);
  if (remove) await removeHabit(remove.dataset.remove);
});

// Color picker
const cp = document.getElementById('color-options');
COLORS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'color-opt' + (c === selectedColor ? ' selected' : '');
  d.style.background = c;
  d.addEventListener('click', () => {
    selectedColor = c;
    cp.querySelectorAll('.color-opt').forEach(x => x.classList.remove('selected'));
    d.classList.add('selected');
  });
  cp.appendChild(d);
});

document.getElementById('add-habit-btn').addEventListener('click', async () => {
  const inp = document.getElementById('habit-name');
  const name = inp.value.trim();
  if (!name) return;
  habits.push({ id: uid(), name, color: selectedColor, created: Date.now() });
  inp.value = '';
  await DB.set('habits', habits);
  render();
});

document.getElementById('habit-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('add-habit-btn').click();
});

async function load() {
  const [h, c] = await Promise.all([DB.get('habits'), DB.get('checkins')]);
  habits = Array.isArray(h) ? h : [];
  checkins = (c && typeof c === 'object') ? c : {};
  render();
}
load();
</script>
</body>
</html>
