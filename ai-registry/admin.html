<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — AI Registry</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F8F6F3; --surface: #FFFFFF; --border: #E8E3DD;
  --ink: #1C1A18; --muted: #7A7068; --subtle: #B8B0A6;
  --amber: #D97706; --amber-dk: #B45309; --amber-bg: rgba(217,119,6,0.08); --amber-border: rgba(217,119,6,0.25);
  --green: #059669; --green-bg: rgba(5,150,105,0.08); --green-border: rgba(5,150,105,0.2);
  --red: #DC2626; --red-bg: rgba(220,38,38,0.06); --red-border: rgba(220,38,38,0.2);
  --blue: #2563EB; --blue-bg: rgba(37,99,235,0.06); --blue-border: rgba(37,99,235,0.2);
  --purple: #7C3AED; --purple-bg: rgba(124,58,237,0.06);
  --r: 8px; --shadow: 0 1px 3px rgba(28,26,24,0.06), 0 8px 24px rgba(28,26,24,0.04);
}
body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── Nav ── */
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: stretch; position: sticky; top: 0; z-index: 10; }
.nav-brand { font-size: 1rem; font-weight: 800; letter-spacing: -0.02em; padding: 0.9rem 0; margin-right: 1.5rem; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.nav-brand span { color: var(--amber); }
.nav-links { display: flex; align-items: stretch; flex: 1; gap: 0; }
.nav-link { font-size: 0.82rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 0 1rem; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.nav-link:hover { color: var(--ink); }
.nav-link.active { color: var(--amber-dk); border-bottom-color: var(--amber); font-weight: 600; }
.nav-spacer { flex: 1; }
.nav-count { font-size: 0.7rem; background: var(--ink); color: #fff; border-radius: 100px; padding: 2px 8px; font-weight: 700; align-self: center; }
@media (max-width: 540px) { .nav-link { padding: 0 0.6rem; font-size: 0.75rem; } .nav-count { display: none; } }

/* ── Page ── */
.page { padding: 2rem 1.5rem; max-width: 1100px; margin: 0 auto; }

/* ── Header ── */
.board-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
.board-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; }
.board-title span { color: var(--amber); }
.board-sub { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; }

/* ── Search ── */
.search-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.search-input { flex: 1; min-width: 180px; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.875rem; font-family: inherit; background: var(--surface); color: var(--ink); outline: none; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--amber); }

/* ── Status tabs ── */
.status-tabs { display: flex; gap: 0; border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--surface); flex-shrink: 0; }
.status-tab { font-size: 0.78rem; font-weight: 600; padding: 0.55rem 1rem; border: none; background: none; cursor: pointer; font-family: inherit; color: var(--muted); transition: all 0.15s; border-right: 1px solid var(--border); white-space: nowrap; }
.status-tab:last-child { border-right: none; }
.status-tab.active { background: var(--ink); color: #fff; }
.status-tab.active.approved { background: var(--green); }
.status-tab.active.experimental { background: var(--amber); }
.status-tab.active.rejected { background: var(--red); }
.tab-count { font-size: 0.65rem; background: rgba(255,255,255,0.25); border-radius: 100px; padding: 1px 5px; margin-left: 4px; }

/* ── Category chips ── */
.cat-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.cat-chip { font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.75rem; border-radius: 100px; border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.12s; }
.cat-chip:hover { border-color: var(--ink); color: var(--ink); }
.cat-chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ── Tool grid ── */
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.25rem; box-shadow: var(--shadow); cursor: pointer; transition: all 0.15s; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 0.75rem; }
.tool-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(28,26,24,0.1); border-color: var(--amber-border); }
.tool-card-top { display: flex; align-items: flex-start; gap: 0.75rem; }
.tool-avatar { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 800; flex-shrink: 0; }
.tool-card-meta { flex: 1; min-width: 0; }
.tool-name { font-size: 0.975rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-vendor { font-size: 0.72rem; color: var(--muted); }
.tool-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tool-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: auto; }
.cat-tag { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 100px; }
.status-badge { font-size: 0.68rem; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }
.badge-approved     { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.badge-experimental { background: var(--amber-bg);  color: var(--amber-dk); border: 1px solid var(--amber-border); }
.badge-rejected     { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }

/* ── Tool detail ── */
.tool-detail-header { display: flex; align-items: flex-start; gap: 1.25rem; margin-bottom: 2rem; flex-wrap: wrap; }
.tool-detail-avatar { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 800; flex-shrink: 0; }
.tool-detail-info { flex: 1; }
.tool-detail-name { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.3rem; }
.tool-detail-vendor { font-size: 0.875rem; color: var(--muted); margin-bottom: 0.6rem; }
.tool-detail-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.detail-section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 1rem; }
.detail-body { font-size: 0.95rem; line-height: 1.75; color: var(--ink); white-space: pre-wrap; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.detail-field { }
.detail-field-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.3rem; }
.detail-field-value { font-size: 0.9rem; color: var(--ink); }
.detail-field-value a { color: var(--amber-dk); text-decoration: none; }
.detail-field-value a:hover { text-decoration: underline; }
.review-chip { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; font-weight: 600; padding: 0.3rem 0.75rem; border-radius: 100px; }
.review-soon { background: var(--amber-bg); color: var(--amber-dk); border: 1px solid var(--amber-border); }
.review-ok   { background: var(--green-bg);  color: var(--green);     border: 1px solid var(--green-border); }
.review-past { background: var(--red-bg);    color: var(--red);       border: 1px solid var(--red-border); }

/* ── Forms ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.form-group { margin-bottom: 0; }
.form-group + .form-group { margin-top: 0; }
label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.35rem; }
.text-input, .select-input, .textarea-input, .date-input { width: 100%; padding: 0.65rem 0.85rem; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.875rem; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; transition: border-color 0.15s; }
.text-input:focus, .select-input:focus, .textarea-input:focus, .date-input:focus { border-color: var(--amber); }
.textarea-input { resize: vertical; min-height: 100px; line-height: 1.65; }

/* ── Buttons ── */
.btn { padding: 0.65rem 1.1rem; border-radius: var(--r); border: none; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--amber); color: #fff; }
.btn-primary:hover { background: var(--amber-dk); }
.btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
.btn-danger { background: none; border: 1.5px solid var(--red-border); color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }
.btn-green { background: var(--green); color: #fff; border: none; }
.btn-green:hover { opacity: 0.9; }
.btn-sm { padding: 0.35rem 0.75rem; font-size: 0.75rem; }

/* ── Admin list ── */
.admin-tool { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 0.85rem 1.1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.85rem; }
.admin-tool-info { flex: 1; min-width: 0; }
.admin-tool-name { font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-tool-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
.admin-tool-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

/* ── Utility ── */
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
.empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-text { font-size: 0.9rem; margin-bottom: 1rem; }
.loading { text-align: center; padding: 4rem; color: var(--muted); }
.not-found { text-align: center; padding: 4rem 1rem; }
.not-found h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
.not-found p { font-size: 0.875rem; color: var(--muted); margin-bottom: 1.5rem; }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 0.7rem 1.25rem; border-radius: var(--r); font-size: 0.85rem; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
.notice { padding: 0.85rem 1.1rem; border-radius: var(--r); font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.25rem; }
.notice-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-dk); }
.notice-green { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">mere<span>base</span></a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Registry</a>
    <a class="nav-link active" href="admin.html">Admin</a>
  </div>
</nav>

<div class="page" style="max-width:860px">
  <div style="margin-bottom:1.75rem">
    <div class="page-eyebrow" style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--amber-dk);margin-bottom:0.4rem">Admin</div>
    <h1 style="font-size:1.6rem;font-weight:800;letter-spacing:-0.03em">Manage <span style="color:var(--amber)">registry</span></h1>
    <p style="font-size:0.875rem;color:var(--muted);margin-top:0.4rem">Add and update AI tools, set status, assign contacts, and review dates.</p>
  </div>

  <!-- Reset notice (only shown after explicit reset) -->
  <div id="reset-notice" class="notice notice-green" style="display:none">
    Registry reset — 20 starter tools loaded. Edit them to match your organisation.
  </div>

  <!-- Edit/Add form -->
  <div class="card">
    <div class="section-title" id="form-title">Add new tool <span style="font-weight:400;color:var(--muted);font-size:0.75rem" id="edit-hint"></span></div>
    <div class="form-grid" style="margin-bottom:1rem">
      <div class="form-group">
        <label>Tool name *</label>
        <input type="text" class="text-input" id="f-name" placeholder="e.g. Claude" maxlength="80">
      </div>
      <div class="form-group">
        <label>Vendor / maker</label>
        <input type="text" class="text-input" id="f-vendor" placeholder="e.g. Anthropic" maxlength="80">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select class="select-input" id="f-cat">
          <option value="Assistant">Assistant</option>
          <option value="Coding">Coding</option>
          <option value="Writing">Writing</option>
          <option value="Image">Image</option>
          <option value="Video">Video</option>
          <option value="Voice">Voice</option>
          <option value="Research">Research</option>
          <option value="Productivity">Productivity</option>
          <option value="Automation">Automation</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select class="select-input" id="f-status">
          <option value="approved">Approved</option>
          <option value="experimental">Experimental</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="form-group">
        <label>Internal contact</label>
        <input type="text" class="text-input" id="f-contact" placeholder="e.g. Jane Smith, IT Team" maxlength="80">
      </div>
      <div class="form-group">
        <label>Next review date</label>
        <input type="date" class="date-input" id="f-review">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:1rem">
      <label>Enablement / onboarding link</label>
      <input type="url" class="text-input" id="f-url" placeholder="https://your-wiki/ai-tools/…">
    </div>
    <div class="form-group" style="margin-bottom:1rem">
      <label>Description</label>
      <textarea class="textarea-input" id="f-desc" rows="3" placeholder="What does this tool do? When should people use it?"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:1.25rem">
      <label>Organisation notes</label>
      <textarea class="textarea-input" id="f-notes" rows="3" placeholder="Approval conditions, licence info, usage restrictions…"></textarea>
    </div>
    <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
      <button type="button" class="btn btn-primary" id="save-btn" onclick="saveTool()">Add tool</button>
      <button type="button" class="btn btn-ghost" id="cancel-btn" onclick="cancelEdit()" style="display:none">Cancel</button>
    </div>
  </div>

  <!-- Tool list -->
  <div class="section-title" style="margin-top:0.5rem">
    All tools
    <span style="display:flex;align-items:center;gap:0.75rem">
      <span style="font-size:0.72rem;font-weight:400;color:var(--subtle)" id="tool-count"></span>
      <button type="button" class="btn btn-ghost btn-sm" onclick="loadStarterTools()" title="Reset registry to the 20 default starter tools">Reset to defaults</button>
    </span>
  </div>
  <div id="tool-list"><div class="loading">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

  {
    id:'jasper', name:'Jasper', vendor:'Jasper AI', category:'Writing',
    status:'rejected', description:'AI copywriting tool for marketing content. Pre-dates current generation of AI assistants.',
    enablementUrl:'', contact:'', nextReview:'2026-06-01', notes:'Rejected — superseded by Claude and ChatGPT for general writing at significantly lower cost. Existing licences not to be renewed.'
  },
  {
    id:'copyai', name:'Copy.ai', vendor:'Copy.ai', category:'Writing',
    status:'rejected', description:'AI tool for short-form marketing copy — ads, product descriptions, email subject lines.',
    enablementUrl:'', contact:'', nextReview:'2026-06-01', notes:'Rejected — use Claude or ChatGPT with appropriate prompting instead. Better output, no additional licence cost.'
  },
];
</script>
<script>
const DB = window.MB ? {
  async get(key) {
    const r = await fetch(`${MB.api}/data?app_id=${MB.app_id}&key=${encodeURIComponent(key)}`, { credentials:'include' });
    if (!r.ok) throw new Error('Load failed: ' + r.status);
    return (await r.json()).value ?? null;
  },
  async set(key, value) {
    const r = await fetch(`${MB.api}/data`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ app_id: MB.app_id, key, value }) });
    if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error(j.error || 'Save failed: ' + r.status); }
  }
} : {
  async get(key) { return key==='tools' ? JSON.parse(JSON.stringify(STARTER_TOOLS)) : null; },
  async set(key, value) { console.log('MOCK set', key, value); }
};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
function uid() { return Math.random().toString(36).slice(2)+Date.now().toString(36); }

const STATUS_COLORS = { approved:'var(--green)', experimental:'var(--amber-dk)', rejected:'var(--red)' };

let tools=[], editingId=null;

async function load() {
  try {
    const stored = await DB.get('tools');
    if (stored && stored.length) {
      tools = stored;
    } else {
      tools = JSON.parse(JSON.stringify(STARTER_TOOLS));
      await DB.set('tools', tools);
    }
    renderList();
  } catch(e) {
    document.getElementById('tool-list').innerHTML = `<div style="color:var(--red);font-size:0.85rem;padding:1rem">Failed to load: ${esc(e.message)}</div>`;
  }
}

function renderList() {
  document.getElementById('tool-count').textContent = tools.length + ' tool' + (tools.length!==1?'s':'');
  if (!tools.length) {
    document.getElementById('tool-list').innerHTML = '<div class="empty-state" style="padding:2rem"><div class="empty-icon" style="font-size:1.5rem">🔧</div><p class="empty-text">No tools yet.</p></div>';
    return;
  }
  const sorted = [...tools].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  document.getElementById('tool-list').innerHTML = sorted.map(t => `
    <div class="admin-tool">
      <div style="width:32px;height:32px;border-radius:8px;background:${esc(catColor(t.category))};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;flex-shrink:0">${(t.name||'?')[0].toUpperCase()}</div>
      <div class="admin-tool-info">
        <div class="admin-tool-name">${esc(t.name)}</div>
        <div class="admin-tool-sub">${esc(t.vendor||'')}${t.vendor&&t.category?' · ':''}${esc(t.category||'')} · <span style="color:${STATUS_COLORS[t.status]||'inherit'};font-weight:600">${esc(t.status||'')}</span>${t.nextReview?' · review '+esc(t.nextReview):''}</div>
      </div>
      <div class="admin-tool-actions">
        <a class="btn btn-ghost btn-sm" href="tool.html?id=${encodeURIComponent(t.id)}">View</a>
        <button type="button" class="btn btn-ghost btn-sm" onclick="startEdit('${t.id}')">Edit</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="deleteTool('${t.id}')">Delete</button>
      </div>
    </div>`).join('');
}

function catColor(cat) {
  const m={Assistant:'#7C3AED',Coding:'#2563EB',Writing:'#059669',Image:'#D97706',Video:'#DC2626',Voice:'#0891B2',Research:'#4F46E5',Productivity:'#B45309',Automation:'#6D28D9'};
  return m[cat]||'#1C1A18';
}

function startEdit(id) {
  const t = tools.find(x=>x.id===id);
  if (!t) return;
  editingId = id;
  document.getElementById('f-name').value    = t.name||'';
  document.getElementById('f-vendor').value  = t.vendor||'';
  document.getElementById('f-cat').value     = t.category||'Assistant';
  document.getElementById('f-status').value  = t.status||'experimental';
  document.getElementById('f-contact').value = t.contact||'';
  document.getElementById('f-review').value  = t.nextReview||'';
  document.getElementById('f-url').value     = t.enablementUrl||'';
  document.getElementById('f-desc').value    = t.description||'';
  document.getElementById('f-notes').value   = t.notes||'';
  document.getElementById('form-title').textContent = 'Edit tool';
  document.getElementById('edit-hint').textContent = '— ' + (t.name||'');
  document.getElementById('save-btn').textContent = 'Save changes';
  document.getElementById('cancel-btn').style.display = '';
  document.querySelector('.card').scrollIntoView({ behavior:'smooth', block:'start' });
}

function cancelEdit() {
  editingId = null;
  document.getElementById('f-name').value = document.getElementById('f-vendor').value = document.getElementById('f-contact').value = document.getElementById('f-review').value = document.getElementById('f-url').value = document.getElementById('f-desc').value = document.getElementById('f-notes').value = '';
  document.getElementById('f-cat').value = 'Assistant';
  document.getElementById('f-status').value = 'experimental';
  document.getElementById('form-title').textContent = 'Add new tool';
  document.getElementById('edit-hint').textContent = '';
  document.getElementById('save-btn').textContent = 'Add tool';
  document.getElementById('cancel-btn').style.display = 'none';
}

async function saveTool() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Tool name is required'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const tool = {
      id: editingId || uid(),
      name,
      vendor:       document.getElementById('f-vendor').value.trim(),
      category:     document.getElementById('f-cat').value,
      status:       document.getElementById('f-status').value,
      contact:      document.getElementById('f-contact').value.trim(),
      nextReview:   document.getElementById('f-review').value,
      enablementUrl:document.getElementById('f-url').value.trim(),
      description:  document.getElementById('f-desc').value.trim(),
      notes:        document.getElementById('f-notes').value.trim(),
      ts: editingId ? (tools.find(x=>x.id===editingId)?.ts||Date.now()) : Date.now(),
    };
    if (editingId) {
      tools = tools.map(x => x.id===editingId ? tool : x);
    } else {
      tools = [tool, ...tools];
    }
    await DB.set('tools', tools);
    cancelEdit();
    renderList();
    document.getElementById('init-notice').style.display = 'none';
    toast(editingId ? 'Saved' : 'Tool added');
  } catch(e) {
    toast('Failed: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = editingId ? 'Save changes' : 'Add tool';
}

async function deleteTool(id) {
  const t = tools.find(x=>x.id===id);
  if (!t || !confirm(`Delete "${t.name}"? This cannot be undone.`)) return;
  const prev = [...tools];
  tools = tools.filter(x=>x.id!==id);
  try { await DB.set('tools', tools); renderList(); toast('Deleted'); }
  catch(e) { tools = prev; toast('Failed: ' + e.message); }
}

async function loadStarterTools() {
  if (!confirm('Reset to the 20 starter tools? This will replace all current tools.')) return;
  try {
    tools = JSON.parse(JSON.stringify(STARTER_TOOLS));
    await DB.set('tools', tools);
    renderList();
    const notice = document.getElementById('reset-notice');
    notice.style.display = 'block';
    setTimeout(() => notice.style.display = 'none', 4000);
  } catch(e) {
    toast('Failed: ' + e.message);
  }
}

load();
</script>
</body>
</html>
