<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post — Noticeboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F8F6F3; --surface: #FFFFFF; --border: #E8E3DD;
  --ink: #1C1A18; --muted: #7A7068; --subtle: #B8B0A6;
  --amber: #D97706; --amber-dk: #B45309; --amber-bg: rgba(217,119,6,0.08); --amber-border: rgba(217,119,6,0.25);
  --green: #059669; --green-bg: rgba(5,150,105,0.08); --green-border: rgba(5,150,105,0.2);
  --red: #DC2626; --red-bg: rgba(220,38,38,0.06); --red-border: rgba(220,38,38,0.2);
  --blue: #2563EB; --blue-bg: rgba(37,99,235,0.08);
  --r: 8px; --shadow: 0 1px 3px rgba(28,26,24,0.06), 0 8px 24px rgba(28,26,24,0.04);
}
body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── Nav ── */
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: stretch; position: sticky; top: 0; z-index: 10; }
.nav-brand { font-size: 1rem; font-weight: 800; letter-spacing: -0.02em; padding: 0.9rem 0; margin-right: 1.5rem; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.nav-brand span { color: var(--amber); }
.nav-links { display: flex; align-items: stretch; flex: 1; }
.nav-link { font-size: 0.82rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 0 1rem; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.nav-link:hover { color: var(--ink); }
.nav-link.active { color: var(--amber-dk); border-bottom-color: var(--amber); font-weight: 600; }
.nav-spacer { flex: 1; }
.nav-badge { font-size: 0.68rem; background: var(--amber-bg); color: var(--amber-dk); border: 1px solid var(--amber-border); border-radius: 100px; padding: 2px 8px; font-weight: 700; align-self: center; }
@media (max-width: 540px) { .nav-link { padding: 0 0.6rem; font-size: 0.75rem; } .nav-badge { display: none; } }

/* ── Page wrapper ── */
.page { padding: 2rem 1.5rem; max-width: 780px; margin: 0 auto; }
.page-wide { padding: 2rem 1.5rem; max-width: 1000px; margin: 0 auto; }

/* ── Page header ── */
.page-eyebrow { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber-dk); margin-bottom: 0.4rem; }
.page-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 0.5rem; }
.page-title span { color: var(--amber); }
.page-sub { font-size: 0.875rem; color: var(--muted); line-height: 1.6; margin-bottom: 2rem; }

/* ── Hero banner ── */
.hero { background: var(--ink); color: #fff; padding: 3rem 1.5rem; text-align: center; }
.hero-logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; margin-bottom: 1rem; opacity: 0.7; }
.hero-logo span { color: var(--amber); }
.hero-name { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 0.5rem; }
.hero-sub { font-size: 1rem; color: rgba(255,255,255,0.6); }

/* ── Category pills ── */
.cats { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
.cat-pill { font-size: 0.78rem; font-weight: 600; padding: 0.35rem 0.85rem; border-radius: 100px; border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: inherit; }
.cat-pill:hover { border-color: var(--amber); color: var(--amber-dk); }
.cat-pill.active { background: var(--amber); border-color: var(--amber); color: #fff; }

/* ── Post cards ── */
.posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; box-shadow: var(--shadow); cursor: pointer; transition: all 0.15s; text-decoration: none; color: inherit; display: block; border-top: 3px solid var(--amber); }
.post-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(28,26,24,0.1); }
.post-card.cat-general { border-top-color: var(--amber); }
.post-card.cat-people { border-top-color: var(--green); }
.post-card.cat-project { border-top-color: var(--blue); }
.post-card.cat-urgent  { border-top-color: var(--red); }
.post-cat { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.6rem; }
.post-cat.cat-general { color: var(--amber-dk); }
.post-cat.cat-people  { color: var(--green); }
.post-cat.cat-project { color: var(--blue); }
.post-cat.cat-urgent  { color: var(--red); }
.post-card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.5rem; }
.post-card-body { font-size: 0.82rem; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0.75rem; }
.post-meta { font-size: 0.72rem; color: var(--subtle); display: flex; align-items: center; gap: 0.5rem; }
.post-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--subtle); }
.post-pinned-badge { font-size: 0.65rem; font-weight: 700; background: var(--amber-bg); color: var(--amber-dk); border: 1px solid var(--amber-border); border-radius: 100px; padding: 1px 7px; }

/* ── Single post ── */
.post-full { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 2rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
.post-full-cat { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.75rem; }
.post-full-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 0.75rem; }
.post-full-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.post-full-body { font-size: 0.95rem; line-height: 1.8; color: var(--ink); white-space: pre-wrap; }

/* ── Buttons ── */
.btn { padding: 0.7rem 1.2rem; border-radius: var(--r); border: none; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--amber); color: #fff; }
.btn-primary:hover { background: var(--amber-dk); }
.btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
.btn-danger { background: none; border: 1.5px solid var(--red-border); color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }
.btn-sm { padding: 0.4rem 0.8rem; font-size: 0.78rem; }

/* ── Forms ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.form-group { margin-bottom: 1.1rem; }
label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.4rem; }
.text-input, .select-input, .textarea-input { width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 0.9rem; font-family: inherit; background: var(--bg); color: var(--ink); outline: none; transition: border-color 0.15s; }
.text-input:focus, .select-input:focus, .textarea-input:focus { border-color: var(--amber); }
.textarea-input { resize: vertical; min-height: 160px; line-height: 1.7; }
.form-hint { font-size: 0.75rem; color: var(--subtle); margin-top: 0.3rem; }
.form-check { display: flex; align-items: center; gap: 0.6rem; font-size: 0.875rem; cursor: pointer; }
.form-check input { width: 16px; height: 16px; accent-color: var(--amber); cursor: pointer; }
.form-nav { display: flex; gap: 0.75rem; align-items: center; margin-top: 1.25rem; flex-wrap: wrap; }

/* ── Admin post list ── */
.admin-post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 1rem; }
.admin-post-info { flex: 1; min-width: 0; }
.admin-post-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-post-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
.admin-post-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

/* ── Utility ── */
.pinned-section { margin-bottom: 2rem; }
.section-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.5rem; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
.empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-text { font-size: 0.9rem; }
.loading { text-align: center; padding: 4rem; color: var(--muted); font-size: 0.9rem; }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 0.7rem 1.25rem; border-radius: var(--r); font-size: 0.85rem; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.not-found { text-align: center; padding: 4rem 1rem; }
.not-found h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
.not-found p { font-size: 0.875rem; color: var(--muted); margin-bottom: 1.5rem; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">mere<span>base</span></a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Board</a>
    <a class="nav-link" href="admin.html">Admin</a>
  </div>
</nav>

<div class="page">
  <div style="margin-bottom:1.25rem">
    <a class="btn btn-ghost btn-sm" href="index.html">← Back to board</a>
  </div>
  <div id="content"><div class="loading">Loading…</div></div>
</div>

<script>
const MOCK = {
  posts: [
    { id:'1', title:'Welcome to the noticeboard', body:'This is your team\'s central noticeboard. Post announcements, project updates, and news here.\n\nEveryone on the team can see this board. Only admins can post.', category:'general', author:'Admin', pinned:true, ts: Date.now() - 86400000 },
  ]
};

const CATS = {
  general: { label:'General',  color:'cat-general' },
  people:  { label:'People',   color:'cat-people' },
  project: { label:'Project',  color:'cat-project' },
  urgent:  { label:'Urgent',   color:'cat-urgent' },
};

const DB = window.MB ? {
  async get(key) {
    const r = await fetch(`${MB.api}/data?app_id=${MB.app_id}&key=${encodeURIComponent(key)}`, { credentials:'include' });
    if (!r.ok) throw new Error('Load failed: ' + r.status);
    return (await r.json()).value ?? null;
  }
} : {
  async get(key) { return JSON.parse(JSON.stringify(MOCK[key] ?? null)); }
};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const wrap = document.getElementById('content');
  if (!id) { wrap.innerHTML = notFound(); return; }
  try {
    const posts = await DB.get('posts');
    const all   = posts || MOCK.posts;
    const post  = all.find(p => p.id === id);
    if (!post) { wrap.innerHTML = notFound(); return; }
    const catInfo = CATS[post.category] || { label: post.category, color: 'cat-general' };
    document.title = post.title + ' — Noticeboard';
    wrap.innerHTML = `
      <div class="post-full">
        <div class="post-full-cat ${catInfo.color}">${esc(catInfo.label)}${post.pinned ? ' &nbsp;📌' : ''}</div>
        <h1 class="post-full-title">${esc(post.title)}</h1>
        <div class="post-full-meta">
          ${post.author ? `<span>${esc(post.author)}</span><span>·</span>` : ''}
          <span>${fmtDate(post.ts)}</span>
        </div>
        <div class="post-full-body">${esc(post.body)}</div>
      </div>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
        <a class="btn btn-ghost" href="index.html">← All posts</a>
        <button type="button" class="btn btn-ghost" onclick="copyLink()" style="margin-left:auto">Copy link</button>
      </div>`;
  } catch(e) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p class="empty-text">Could not load — ${esc(e.message)}</p></div>`;
  }
}

function notFound() {
  return `<div class="not-found"><h2>Post not found</h2><p>This post may have been removed.</p><a class="btn btn-primary" href="index.html">Back to board</a></div>`;
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.querySelector('[onclick="copyLink()"]');
    if (btn) { const orig = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = orig, 1500); }
  });
}

load();
</script>
</body>
</html>
